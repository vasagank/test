<ons-page id="vault_page"> 
    
    <ons-toolbar class="vm-page-toolbar" id="vault_toolbar">
        <div class="vm_vault_actions_all">
            <button class="vm-sheet-open vm_vault_actionButton with-separator" data-action="sort" id="vault_sortBtn">
                <i class="fa fa-sort-amount-asc"></i> Sort By
            </button>
            <button class="vm-sheet-open vm_vault_actionButton" data-action="filter" id="vault_filterBtn">
                <i class="fa fa-filter"></i> Filter
            </button>
        </div>
    </ons-toolbar>

    <div class="vault-top-bar" id="vaulttopbar">
        <div class="vault-summary" id="vaultSummary">
            Showing <span id="vaultVisibleCount">0</span> of <span id="vaultTotalCount">0</span> results
        </div>
        <div class="vault-chips" id="vaultFilterChips"></div>
    </div>
    <div class="vm_vault_container" id="vm_v_sec">   
        <div id="vm_upgrade_inline" class="vm_upgrade_inline hide" onclick="open_upgrade()">
            <i class="fas fa-crown vm_upgrade_icon"></i>
            <span class="vm_upgrade_text"></span>
            <span class="vm_upgrade_cta">Upgrade</span>
        </div>
        <div class="vm_vault_list" id="vm_vault_list"></div>
    </div>
    <script type="text/javascript">
    let current_page = 0;
    let is_loading = false;
    let has_more_data = true;
    let lastScrollLoad = 0;
    let vault_scroll_top = 0;
    let vm_container;

    let VAULT_FILTER_SCHEMA = {
        sort: "string",
        search: "string",
        vaultRemainder : "string",
        categories: "array",
        dateRange: "object",
        pinFav:"string",
        vaultReminderMissing:"string",
        weakPassword:"string",
        security:"string",
        hashPassword:"string"
    };

    document.addEventListener("show", function (e) {
        const page = e.target;
        if (page.id !== "vault_page") {
            return;
        }
        vm_log("dashboard_action", dashboard_action);

        let vault_header;
        //const vault_header = document.querySelector(".custom_header");
        const listContainer = dgi("vm_vault_list");
        const vault_scroll_container = page.querySelector(".page__content");
        vm_container = vault_scroll_container;

        //vault_header.classList.remove("vm-hidden");
        //vault_header.classList.add("cur_page", "vault_page");

        if(!vault_initialized) {
            init_vault_events(vault_scroll_container);
            vault_initialized = true;
        }

        current_page = 0;
        is_loading = false;
        has_more_data = true;
        lastScrollLoad = 0;
        vault_scroll_top = 0;

        if(dashboard_action) {
            handle_dashboard_action_vault(dashboard_action);
            dashboard_action = null;
        }

        show_visible();
        (async () => {
            let total = await count_vaults_db(vault_filters);
            render_vault_meta(total);
            renderUpgradeInline("vault", total, VAULT_LIMIT);
        })();       

        //listContainer.innerHTML = "";
        load_more_vaults(1, {reset: true, filters: vault_filters});

        page.addEventListener("hide", () => {
            //const vault_header = document.querySelector(".custom_header");
            //vault_header.classList.add("vm-hidden");
            //vault_header.classList.remove("cur_page", "vault_page");
            is_page_loading(false);
            clear_filters();            
        });
    });




function init_vault_events(container) {

    container.addEventListener("scroll", e => {
        handle_vault_scroll(e, container);
    });

    document.querySelectorAll(".vault_sort").forEach(choice => {
        choice.addEventListener("click", function () {
            if(this.classList.contains("active")) {
                return;
            }
            [...this.parentElement.children].forEach(c => c.classList.remove("active"));
            this.classList.add("active");
            vault_filters.sort = this.dataset.value;
            apply_filter(container);
        });
    });

    dgi("vm_vault_applyFilter").addEventListener("click", () => {
        vault_filters.search = dgi("vm_vault_searchInput").value.trim();
        vault_filters.categories = get_vault_selected_categories();
        vault_filters.dateRange = get_daterange("vm") || null;
        vault_filters.vaultReminderMissing = dgi("vm_reminder").value;
        vault_filters.pinFav = dgi("vm_priority").value;
        apply_filter(container);
    });

    dgi("vm_vault_clearFilter").addEventListener("click", () => {
        clear_filters();
        apply_filter(container);
    });

    dgi("vm_date_range").addEventListener("click", on_date_range_click);
    dgi("vm_cat_select_all").addEventListener("click", select_all_categories);
    dgi("vm_cat_unselect_all").addEventListener("click", unselect_all_categories);

    render_category_checklist(dgi("vault_category_checklist"), vault_categories);   
}

function clearVMFilter() {
    clear_filters();
    apply_filter(vm_container);
}

dgi("as-pin").onclick = () => toggle_flag({
    id:activeVaultId, 
    action:"pin", 
    field:"is_pinned", 
    successOn:"Pinned", 
    successOff:"Unpinned", 
    hideSheet:true
});

dgi("as-fav").onclick = () => toggle_flag({
    id:activeVaultId, 
    action:"favorite", 
    field:"is_favorite", 
    successOn:"Added to favorites", 
    successOff:"Removed from favorites", 
    hideSheet:true
});

dgi("vv-pin").onclick = () => toggle_flag({
    id: current_vault_id,
    action: "pin",
    field: "is_pinned",
    successOn: "Pinned",
    successOff: "Unpinned",
    updateView: true
});

dgi("vv-fav").onclick = () => toggle_flag({
    id: current_vault_id,
    action: "favorite",
    field: "is_favorite",
    successOn: "Added to favorites",
    successOff: "Removed from favorites",
    updateView: true
});

document.querySelectorAll('#vaultActionSheet ons-action-sheet-button')[2].onclick = () => edit_vault(activeVaultId);
document.querySelectorAll('#vaultActionSheet ons-action-sheet-button')[3].onclick = () => delete_vault(activeVaultId);

function handle_vault_scroll(e, container) {
    if(is_loading || !has_more_data) {
        return;
    }
    const now = Date.now();
    if(now - lastScrollLoad < 300) {
        return;
    }
    if(container.scrollTop + container.clientHeight >= container.scrollHeight - 200) {
        lastScrollLoad = now;
        load_more_vaults(current_page + 1, {filters: vault_filters});
    }
}

function build_vault_where(filters = {}) {

    const whereParts = [];
    const whereValues = [];
    const now = Date.now();

    whereParts.push("status = ?");
    whereValues.push(1);

    if(filters.dateRange?.from) {
        whereParts.push("created_at >= ?");
        whereValues.push(filters.dateRange.from);
    }

    if(filters.dateRange?.to) {
        whereParts.push("created_at <= ?");
        whereValues.push(filters.dateRange.to);
    }

    const pwdRanges = {
      "1": { min: 0, max: weak_pwd_score, minOp: ">", maxOp: "<" },
      "2": { min: 40, max: 70, minOp: ">=", maxOp: "<=" },
      "3": { min: 70, max: null, minOp: ">" }
    };
    const range = pwdRanges[filters.weakPassword];
    if(range) {
      if (range.min !== null) {
        whereParts.push(`password_score ${range.minOp} ?`);
        whereValues.push(range.min);
      }
      if(range.max !== null) {
        whereParts.push(`password_score ${range.maxOp} ?`);
        whereValues.push(range.max);
      }
    }

    if(filters.hashPassword) {
        whereParts.push(`password_hash = ?`);
        whereValues.push(filters.hashPassword);
    }

    if(filters.search) {
        whereParts.push("search_text LIKE ?");
        whereValues.push(`%${filters.search.toLowerCase()}%`);
    }

    if(filters.categories?.length) {
        whereParts.push(`slug IN (${filters.categories.map(() => "?").join(",")})`);
        whereValues.push(...filters.categories);
    }

    if(filters.pinFav) {
        if (filters.pinFav === "pin_fav") {
            whereParts.push("(is_favorite = ? OR is_pinned = ?)");
            whereValues.push(1, 1);
        } else if(filters.pinFav === "fav") {
            whereParts.push("is_favorite = ?");
            whereValues.push(1);
        } else if(filters.pinFav === "pin") {
            whereParts.push("is_pinned = ?");
            whereValues.push(1);
        } else if (filters.pinFav === "attachment") {
            whereParts.push("has_attachment = ?");
            whereValues.push(1);
        } else if (filters.pinFav === "no_attachment") {
            whereParts.push("has_attachment = ?");
            whereValues.push(0);
        }
    }

    if(filters.security) {

        whereParts.push("password_score > ?");
        whereValues.push(0);

        if(filters.security == "crackable" || filters.security == "very_critical") {
            whereParts.push("crack_seconds IS NOT NULL");
            whereParts.push("crack_seconds < ?");
            whereValues.push(300);
        } else if(filters.security == "reused") {
            whereParts.push(`
                password_hash IN (
                    SELECT password_hash
                    FROM vaults
                    WHERE status = 1 
                      AND password_score > 0
                      AND password_hash IS NOT NULL
                    GROUP BY password_hash
                    HAVING COUNT(*) > 1
                )
            `);
            
        } else if(filters.security == "predictable") {
            whereParts.push("predictability_score >= ?");
            whereValues.push(70);
            
        } else if(filters.security == "old") {
            const oldThreshold = Date.now() - (90 * 86400 * 1000);
            whereParts.push("password_updated_at < ?");
            whereValues.push(oldThreshold);            
        }
    }

    if(filters.vaultReminderMissing) {
        if(filters.vaultReminderMissing === "without") {
          whereParts.push("rem_expiry IS NOT NULL");
          whereParts.push("rem_enabled = ?");
          whereValues.push(0);
        } 
        else if(filters.vaultReminderMissing === "expired") {
            whereParts.push("rem_expiry IS NOT NULL AND rem_expiry > 0 AND rem_expiry < ?");
            whereValues.push(now);
        }
        else {
          whereParts.push("rem_enabled = ?");
          whereValues.push(1);
        }
    }
    return {
        whereClause: whereParts.join(" AND "),
        whereValues
    };
}

async function list_vaults_db({page = 1, limit = VaultMateConfig.default.vault_per_page, filters = {} }) {
    const offset = (page - 1) * limit;
    const userSort = get_vault_sort(filters);

    /*let orderBy = [...userSort];
    if (!is_vault_filter_applied(filters)) {
        orderBy = [
            { col: "is_pinned", dir: "DESC" },
            { col: "is_favorite", dir: "DESC" },
            ...userSort
        ];
    }*/
    const usePinPriority = filters.sort === "new_first" && !is_vault_filter_applied(filters);
    let orderBy = usePinPriority ? [{ col: "is_pinned", dir: "DESC" }, { col: "is_favorite", dir: "DESC" }, ...userSort] : [...userSort];
    
    if(filters.security === "predictable") {
        orderBy = [
            { col: "predictability_score", dir: "DESC" },
            { col: "password_score", dir: "ASC" },
            { col: "created_at", dir: "DESC" }
        ];
    }else if (filters.security === "crackable" || filters.security === "very_critical") {
        orderBy = [
            { col: "crack_seconds", dir: "ASC" },
            { col: "password_score", dir: "ASC" },
            { col: "created_at", dir: "DESC" }
        ];
    }

    const {whereClause, whereValues} = build_vault_where(filters);
    //console.log("whereClause", whereClause, "orderBy", orderBy, "whereValues", whereValues);

    if(_MODE_ == "dev") {
        const all = getMockVaultData();
        return all.slice(offset, offset + limit);    
    }    

    const {sql, values} = VaultDB.buildSelect({table: VaultMateConfig.tables.vaults, columns: ["*"], where: whereClause, orderBy, limit, offset});
    values.push(...whereValues);

    const res = await VaultDB.dbExecute(sql, values);
    const rows = [];
    for(let i = 0; i < res.rows.length; i++) {
        const row = res.rows.item(i);
        rows.push(row);        
        if(VaultCache?.setRow) {
            VaultCache.setRow(String(row.id), row);
        }
    }
    return rows;
}

async function load_more_vaults(page, { reset = false, filters = {} } = {}) {
    if(is_loading) {
        return;
    }
    is_loading = true;
    const listContainer = dgi("vm_vault_list");

    if(reset) {
        listContainer.innerHTML = "";
        current_page = 0;
        has_more_data = true;
        is_page_loading(true);
    }

    const rows = await list_vaults_db({page, limit: VaultMateConfig.default.vault_per_page, filters});
    if(rows.length < VaultMateConfig.default.vault_per_page) {
        has_more_data = false;
    }

    if(reset && rows.length === 0) {
        //hide_vault_loader();
        is_page_loading(false);

        let ftitle = "No matching vaults"; 
        let fdesc = "Try changing or clearing the filters to see your vaults.";        

        listContainer.innerHTML = is_vault_filter_applied(filters) ? empty_html("fa-filter",ftitle, fdesc) : empty_html("fa-shield-alt", etitle, edesc);
        is_loading = false;
        show_visible();
        return;
    }

    rows.forEach(row => {
        listContainer.insertAdjacentHTML("beforeend", vault_item_html(row));
    });

    show_visible();
    is_page_loading(false);
    current_page = page;
    is_loading = false;
}

async function apply_filter(container) {
    is_loading = false;
    current_page = 0;
    has_more_data = true;
    lastScrollLoad = 0;

    container.scrollTop = 0;
    dgi("vm_vault_clearFilter").disabled = !is_vault_filter_applied(vault_filters);
    load_more_vaults(1, { reset: true, filters: vault_filters });

    let total = await count_vaults_db(vault_filters);
    render_vault_meta(total);
    renderUpgradeInline("vault", total, VAULT_LIMIT);

    close_bottom_sheet();
}

function on_date_range_click(e) {
    const tag = e.target.closest(".bottom_sheet_tags");
    if (!tag) {
        return;
    }
    document.querySelectorAll("#vm_date_range .bottom_sheet_tags").forEach(t => t.classList.remove("active"));
    tag.classList.add("active");
    filter_date_range = tag.dataset.range;
    dgi("vm_custom_date_range").style.display = filter_date_range === "custom" ? "block" : "none";
}

function clear_filters() {
    vault_filters = {
        sort: "new_first", 
        search: "", 
        categories: [], 
        dateRange: null, 
        vaultRemainder: null,
        pinFav:null,
        vaultReminderMissing:null,
        weakPassword:null,
        security:null,
        hashPassword:null,
    };
    
    dgi("vm_priority").value = "";
    dgi("vm_reminder").value = "";

    dgi("vm_vault_searchInput").value = "";
    document.querySelectorAll("#vm_date_range .bottom_sheet_tags").forEach(t => t.classList.remove("active"));
    document.querySelector('#vm_date_range .bottom_sheet_tags[data-range="any"]')?.classList.add("active");

    dgi("vm_custom_date_range").style.display = "none";
    dgi("vm_date_from").value = "";
    dgi("vm_date_to").value = "";
    filter_date_range = "any";
    document.querySelectorAll("#vault_category_checklist input[type='checkbox']").forEach(cb => cb.checked = false);
    set_vault_filter("sort", "new_first");
}

function handle_dashboard_action_vault(action) {    
    if(typeof action === "string") {
        const parts = action.split("|");
        if(parts.length === 2) {
            set_vault_filter(parts[0], parts[1]);
        }
        return;
    }
    if(typeof action === "object") {
        Object.keys(action).forEach(key => {
            set_vault_filter(key, action[key]);
        });
    }
}

function set_vault_filter(key, value) {
    if(!vault_filters.hasOwnProperty(key)) {
        return;
    }
    const expectedType = VAULT_FILTER_SCHEMA[key];

    if (expectedType === "array") {
        if (Array.isArray(value)) {
            vault_filters[key] = value.slice();
        } else if (value !== null && value !== undefined) {
            vault_filters[key] = [ value ];
        } else {
            vault_filters[key] = [];
        }

    } 
    else if (expectedType === "object") {
        if (typeof value === "object" && value !== null) {
            vault_filters[key] = Object.assign({}, value);
        } else {
            vault_filters[key] = null;
        }
    } 
    else {
        vault_filters[key] = value;
    }

    if(key == "pinFav") {
        dgi("vm_priority").value = value;
    }
    if(key == "search") {
        dgi("vm_vault_searchInput").value = value;
    }
    if(key == "vaultReminderMissing" && value != "expired") {
        dgi("vm_reminder").value = value;
    }

    if(key === "sort") {
        document.querySelectorAll(".vault_sort").forEach(choice => {
            choice.classList.toggle("active", choice.dataset.value === String(value));
        });
    }

    if(key == "categories") {
        const selected = vault_filters.categories;
        document.querySelectorAll("#vault_category_checklist input[type='checkbox']").forEach(checkbox => {
            checkbox.checked = selected.includes(checkbox.value);
        });
    }
    dgi("vm_vault_clearFilter").disabled = !is_vault_filter_applied(vault_filters);    
}

function show_visible() {
    let count = document.querySelectorAll("#vm_vault_list .list-item").length;
    dgi("vaultVisibleCount").textContent = count
}
function render_vault_meta(count = 0, update_count_only = 0) {
    const wrap = dgi("vaultFilterChips");
    const top_bar = dgi("vaulttopbar");
    wrap.innerHTML = "";

    if(!is_vault_filter_applied(vault_filters) && count == 0) {
        top_bar.style.display = "none";
        return;
    } else {
        top_bar.style.display = "block";
    }

    if(is_vault_filter_applied(vault_filters)) {
        wrap.insertAdjacentHTML("beforeend", `<div class="vault-chip clear_filter_bar" onclick="clearVMFilter()">
            <i class="fas fa-times"></i>
            <span>Clear filters</span>
        </div>`);
    }

    dgi("vaultTotalCount").textContent = count;   
    show_visible(); 

    Object.keys(vault_filters).forEach(key => {
        const val = vault_filters[key];
        if(!val || (Array.isArray(val) && !val.length)) {
            return;
        }

        if(key === "categories" && Array.isArray(val)) {
            const first = get_vault_name(val[0]);
            const extra = val.length > 1 ? ` +${val.length - 1}` : "";
            const chip = document.createElement("div");
            chip.className = "vault-chip vm-sheet-open";
            chip.setAttribute("data-action", "filter");

            chip.innerHTML = `<i class="fas fa-folder"></i><span>${first}${extra}</span>`;
            wrap.appendChild(chip);
            return;
        }

        if(key === "dateRange" && typeof val === "object") {
            let label = "";
            if(val.lastDays) {
                label = `Last ${val.lastDays} days`;
            } else if(val.from || val.to) {
                const from = val.from ? new Date(val.from).toLocaleDateString() : "";
                const to = val.to ? new Date(val.to).toLocaleDateString() : "Today";
                label = `${from} to ${to}`;
            }
            if(label) {
                const chip = document.createElement("div");
                chip.className = "vault-chip vm-sheet-open";
                chip.setAttribute("data-action", "filter");

                chip.innerHTML = `<i class="fas fa-calendar-alt"></i><span>${label}</span>`;
                wrap.appendChild(chip);
            }
            return;
        }

        const values = Array.isArray(val) ? val : [val];
        values.forEach(v => {
            let label = v;
            let sheet_name = "filter";
            let iclassname = "";

            if(key === "sort") {
                const el = document.querySelector(`#vm_sort_bs .vault_sort[data-value="${val}"]`);
                label = el ? el.textContent.trim() : val.replace(/_/g, " ");
                sheet_name = "sort";
                iclassname = "fa-sort-amount-down";                
            } else if (key === "search") {
                label = `${v}`;
                iclassname = "fa-search";
            } else if (key === "pinFav") {
                if(v == "pin_fav") {
                    label = "Pinned & favorited";
                    iclassname = "fa-bookmark";
                } else if(v == "pin") {
                    label = "Pinned";
                    iclassname = "fa-thumbtack";
                } else if(v == "fav") {
                    label = "Favorited";
                    iclassname = "fa-star";
                } else if(v == "attachment") {
                    label = "Attachments";
                    iclassname = "fa-paperclip";
                } else if(v == "no_attachment") {
                    label = "No Attachments";
                    iclassname = "fa-paperclip";
                }
                
            } else if (key === "vaultReminderMissing") {
                if(v == "with") {
                    label = "Reminder enabled";
                    iclassname = "fa-bell";
                } else if(v == "without") {
                    label = "Reminder not set";
                    iclassname = "fa-bell-slash";
                } else if(v == "expired") {
                    label = "Expired";
                    iclassname = "fa-clock";
                }
            } else if (key === "weakPassword") {
                iclassname = "fa-lock";
                if(v == "1") {
                    label = "Weak";                    
                } else if(v == "2") {
                    label = "Medium";
                } else if(v == "3") {
                    label = "Strong";
                }
            } else if (key === "security") {
                iclassname = "fa-unlock";
                if(v == "crackable" || v == "very_critical") {
                    label = "Crackable";
                    iclassname = "fa-unlock";                    
                } else if(v == "reused") {
                    label = "Reused";
                    iclassname = "fa-sync-alt"; 
                } else if(v == "predictable") {
                    label = "Predictable";
                    iclassname = "fa-brain";
                } else if(v == "old") {
                    label = "Outdated";
                    iclassname = "fa-clock";
                }
            } else if(key == "hashPassword") {
                iclassname = "fa-bomb";
                label = "Reused";
            }

            if(label) {
                const chip = document.createElement("div");
                chip.className = "vault-chip vm-sheet-open";
                chip.setAttribute("data-action", sheet_name);

                chip.innerHTML = `<i class="fas ${iclassname}"></i><span>${label}</span>`;
                wrap.appendChild(chip);
            }
            
        });
    });

    wrap.style.display = wrap.children.length ? "flex" : "none";
}

</script>
