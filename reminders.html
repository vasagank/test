<ons-page id="reminder_page">

    <ons-toolbar class="vm-page-toolbar" id="reminder_toolbar">
        <div class="vm_vault_actions_all">
            <button class="vm-sheet-open vm_vault_actionButton with-separator" data-action="sort" id="vault_sortBtn">
                <i class="fa fa-sort-amount-asc"></i> Sort By
            </button>
            <button class="vm-sheet-open vm_vault_actionButton" data-action="filter" id="vault_filterBtn">
                <i class="fa fa-filter"></i> Filter
            </button>
        </div>
    </ons-toolbar>

    <div class="vault-top-bar" id="rmtopbar">
        <div class="vault-summary" id="vaultSummary">
            Showing <span id="rmVisibleCount">0</span> of <span id="rmTotalCount">0</span> results
        </div>

        <div class="vault-chips" id="rmFilterChips"></div>
    </div>
    <div class="vm_remainder_container vm_rem_list" id="vm_r_sec">

        <div id="rm_reliability_banner" class="vm-reliability-banner">
            <div class="vm-reliability-icon"><i class="fas fa-bell-slash"></i></div>
            <div class="vm-reliability-content">
                <div class="vm-reliability-text" id="rm_reliability_text"></div>
            </div>
            <div class="vm-reliability-actions">
                <button class="vm-reliability-btn-fix" id="rm_reliability_fix"></button>
                <button class="vm-reliability-btn-dismiss" id="rm_reliability_dismiss">Not now</button>
            </div>
        </div>
    
        <div id="vm_upgrade_inline" class="vm_upgrade_inline hide" onclick="open_upgrade()">
            <i class="fas fa-crown vm_upgrade_icon"></i>
            <span class="vm_upgrade_text"></span>
            <span class="vm_upgrade_cta">Upgrade</span>
        </div>  
        <div class="vm_remainder_list" id="vm_remainder_list"></div>
    </div>

<script type="text/javascript">
const list_container = dgi("vm_remainder_list");

current_page = 0;
is_loading = false;
has_more_data = true;
filter_date_range = "any";

let last_scrollLoad = 0;
let rm_scroll_top = 0;

let RM_FILTER_SCHEMA = {
    sort:"string",
    search:"string",
    type:"string",
    categories:"array",
    date_range:"object",
    source:"string",
    time:"string",
    due_days:"string",
    rm_stats:"string"
};

document.addEventListener("show", function(e) {
    const page = e.target;    
    if(page.id != "reminder_page") {
        return false;
    }

    var scroll_container = page.querySelector('#reminder_page .page__content'); 
    const rem_add_btn = document.querySelector("#vm_vault_addButton");
    rem_add_btn.classList.remove("hide"); 

    if(!reminder_initialized) {
        reminder_initialized = true;
        init_reminder(scroll_container);
        populate_rm_filter_categories();
    }

    current_page = 0;
    is_loading = false;
    has_more_data = true;
    last_scrollLoad = 0;
    rm_scroll_top = 0;

    if(dashboard_action) {
        handle_dashboard_action_rm(dashboard_action);
        dashboard_action = null;
    }

    show_rm_visible();
    (async () => {
        let total = await count_reminders_db(rm_filters);
        render_reminder_meta(total);
        renderUpgradeInline("reminder", total, REMINDER_LIMIT);
        total > 0 ? ensure_reminder_reliability() : "";
    })();  
    
    list_container.innerHTML = "";
    load_more(1, {reset: true, filters: rm_filters});

    page.addEventListener("hide", () => {
        rem_add_btn.classList.add("hide");
        is_page_loading(false);
        clear_rm_filter(1);        
    });
});
</script>
</ons-page>
